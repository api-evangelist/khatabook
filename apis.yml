aid: khatabook
name: Khatabook
description: >-
  Khatabook is a Bengaluru, India-based fintech company building a mobile-first
  digital ledger ("bahi khata") and business management platform for India's
  6.3 crore-strong MSME sector. Founded in 2018 by Ravish Naresh, Vaibhav
  Kalpe, Dhanesh Kumar, and Jaideep Poonia, its flagship Khatabook Android
  app lets shopkeepers and small merchants record credit transactions
  ("udhaar"), send free WhatsApp/SMS payment reminders, collect payments via
  UPI and QR codes, and generate ledger statements — replacing the paper
  notebook ("khata") historically used across Indian retail. The app has been
  downloaded over 50 million times and is offered in 13+ Indian languages.
  Khatabook's portfolio also includes Cashbook (cash-in/cash-out tracking),
  Pagarkhata/Pagarbook (staff attendance and salary management), Biz Analyst
  (Tally mobility for accountants, acquired in 2021 for ~$10M), and a suite
  of GST, EMI, income tax, payroll, and loan calculators. The company has
  raised roughly $190M across seed through Series C from Sequoia Capital,
  Tencent, DST Global, GGV Capital, Y Combinator, B Capital, Moore Strategic
  Ventures, and angels including MS Dhoni, valuing it around $600M. Khatabook
  monetizes via SMB lending tie-ups, premium business tools, and adjacent
  fintech distribution. The Khatabook GitHub organization (verified, owns
  khatabook.com) exists but has no public repositories, and the company does
  not publish a public developer API, SDK, OpenAPI spec, or partner program
  — its surface is a consumer/SMB mobile app rather than a developer platform.
